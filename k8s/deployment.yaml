apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-platform

  template:
    metadata:
      labels:
        app: ai-platform

    spec:
      containers:
        - name: ai-api
          image: enterprise-ai-platform:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
